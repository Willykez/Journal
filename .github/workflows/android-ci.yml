name: Android CI

# Builds a debug APK on every push and pull request, and uploads it as a
# downloadable artifact from the workflow run.
#
# This installs Gradle directly rather than calling ./gradlew — the wrapper
# jar isn't committed yet (see gradle/wrapper/README_MISSING_JAR.md). Once
# you've generated a real gradle-wrapper.jar locally via Android Studio and
# committed it, you can switch the build step below to `./gradlew` instead
# if you prefer — either approach works fine.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
